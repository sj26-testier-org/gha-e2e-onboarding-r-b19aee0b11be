{
  "name": "Study L2 prefix",
  "run-name": "L2/prefix ${{ github.event_name }} ${{ github.event.ref || github.ref }}",
  "on": {
    "push": {
      "branches": [
        "case-L2"
      ],
      "paths": [
        "L2/prefix.txt"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "marker": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 3,
      "env": {
        "CASE": "L2",
        "VARIANT": "prefix",
        "WORKFLOW_REF": "${{ github.workflow_ref }}",
        "WORKFLOW_SHA": "${{ github.workflow_sha }}",
        "PR_ACTION": "${{ github.event.action }}",
        "BASE_SHA": "${{ github.event.pull_request.base.sha }}",
        "HEAD_SHA": "${{ github.event.pull_request.head.sha }}",
        "HEAD_REPO": "${{ github.event.pull_request.head.repo.full_name }}"
      },
      "steps": [
        {
          "name": "Native identity marker",
          "run": "python3 - <<'PY'\nimport json,os\nkeys=['CASE','VARIANT','GITHUB_EVENT_NAME','GITHUB_SHA','GITHUB_REF','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','WORKFLOW_REF','WORKFLOW_SHA','PR_ACTION','BASE_SHA','HEAD_SHA','HEAD_REPO']\nprint('STUDY_MARKER '+json.dumps({k:os.environ.get(k) for k in keys},sort_keys=True))\nPY"
        }
      ]
    }
  }
}
